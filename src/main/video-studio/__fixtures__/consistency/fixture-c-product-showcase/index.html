<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Fixture C — Clean Editorial Product Showcase</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --hf-bg: #f8fafc;
        --hf-surface: #ffffff;
        --hf-ink: #0f172a;
        --hf-accent: #0f766e;
        --hf-border: #e2e8f0;
        --hf-sub-bg: #0f766e;
        --hf-sub-fg: #f8fafc;
        --hf-sub-hi: #fef08a;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--hf-bg);
        color: var(--hf-ink);
        font-family: 'Inter', system-ui, sans-serif;
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        background: var(--hf-bg);
      }
      .accent-band {
        position: absolute;
        top: 0;
        left: 0;
        width: 1080px;
        height: 64px;
        background: var(--hf-accent);
        transform-origin: left center;
      }
      .comp-layer {
        position: absolute;
        inset: 0;
        width: 1080px;
        height: 1920px;
      }
      .hf-scene {
        width: 100%;
        height: 100%;
        padding: 170px 140px 360px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        text-align: center;
      }
      .hf-kicker {
        font-size: 30px;
        font-weight: 700;
        letter-spacing: 0.12em;
        color: var(--hf-accent);
      }
      .hf-heading {
        margin: 0;
        max-width: 760px;
        font-size: 64px;
        line-height: 1.1;
        color: var(--hf-ink);
        font-weight: 700;
      }
      .hf-card {
        width: 780px;
        height: 520px;
        border-radius: 24px;
        background: var(--hf-surface);
        border: 4px solid var(--hf-border);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px;
      }
      .hf-card svg {
        width: 100%;
        height: 100%;
      }
      .subtitle-bar {
        position: absolute;
        left: 130px;
        right: 130px;
        bottom: 130px;
        padding: 28px 36px;
        border-radius: 22px;
        background: var(--hf-sub-bg);
        color: var(--hf-sub-fg);
        font-size: 36px;
        font-weight: 600;
        text-align: center;
      }
      .subtitle-bar .hi {
        color: var(--hf-sub-hi);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="video-studio-main"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="8"
    >
      <div id="accent-band" class="accent-band"></div>
      <div
        id="layer-overview"
        class="comp-layer"
        data-composition-id="01-overview"
        data-composition-src="./compositions/01-overview.html"
        data-start="0"
        data-duration="4"
        data-track-index="0"
      ></div>
      <div
        id="layer-specs"
        class="comp-layer"
        data-composition-id="02-specs"
        data-composition-src="./compositions/02-specs.html"
        data-start="4"
        data-duration="4"
        data-track-index="0"
      ></div>
      <div id="subtitle-pill" class="subtitle-bar">
        Neutral sound with <span class="hi">clean editorial</span> framing
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ paused: true })
        tl.fromTo('#accent-band', { scaleX: 0.72 }, { scaleX: 1, duration: 8, ease: 'none' }, 0)
        window.__timelines['video-studio-main'] = tl
        tl.seek(0)
      }
    </script>
    <script type="module">
      const [styleProfile, assetRegistry] = await Promise.all([
        fetch('./styles/style-profile.json').then((r) => r.json()),
        fetch('./assets/asset-registry.json').then((r) => r.json())
      ])
      const p = styleProfile.visual.palette
      const rootStyle = document.documentElement.style
      rootStyle.setProperty('--hf-bg', p.background)
      rootStyle.setProperty('--hf-surface', p.surface)
      rootStyle.setProperty('--hf-ink', p.primaryText)
      rootStyle.setProperty('--hf-accent', p.accentPrimary)
      rootStyle.setProperty('--hf-border', p.border || p.primaryText)
      rootStyle.setProperty('--hf-sub-bg', styleProfile.subtitle.backgroundColor)
      rootStyle.setProperty('--hf-sub-fg', styleProfile.subtitle.textColor)
      rootStyle.setProperty('--hf-sub-hi', styleProfile.subtitle.highlightColor)

      const card = assetRegistry.assets.find((a) => a.id === 'showcase_card')
      if (card) {
        const defPath = card.states[card.defaultState]?.file
        const [svgA, svgB] = await Promise.all([
          defPath ? fetch('./' + defPath).then((r) => r.text()) : '',
          fetch('./' + (card.states.specs?.file || defPath)).then((r) => r.text())
        ])
        for (const el of document.querySelectorAll('[data-asset-slot="hero-slot"]'))
          el.innerHTML = svgA
        for (const el of document.querySelectorAll('[data-asset-slot="specs-slot"]'))
          el.innerHTML = svgB
      }
    </script>
  </body>
</html>
