<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Fixture C Smoke (2s)</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap"
    />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #f8fafc;
        color: #0f172a;
        font-family: 'Inter', system-ui, sans-serif;
      }
      #root {
        width: 1080px;
        height: 1920px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 40px;
        padding: 96px;
        text-align: center;
      }
      h1 {
        margin: 0;
        font-size: 84px;
        line-height: 1.08;
      }
      p {
        margin: 0;
        font-size: 36px;
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="fixture-c-smoke"
      data-start="0"
      data-width="1080"
      data-height="1920"
      data-fps="30"
      data-duration="2"
    >
      <p>FIXTURE C SMOKE</p>
      <h1 id="title">Acoustic Reference</h1>
    </div>
    <script>
      window.__timelines = window.__timelines || {}
      if (typeof gsap !== 'undefined') {
        const tl = gsap.timeline({ paused: true })
        tl.fromTo('#title', { y: 12 }, { y: 0, duration: 1.5, ease: 'power2.out' }, 0)
        window.__timelines['fixture-c-smoke'] = tl
        tl.seek(0)
      }
    </script>
  </body>
</html>
